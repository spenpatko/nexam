    // =========================================================================
    // HELPER UTILITAS UI, TOAST, MODAL, CLIPBOARD, & GAMBAR
    // =========================================================================
    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getInitials(name) {
      if (!name) return 'US';
      const parts = name.trim().split(/\s+/);
      if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
      return (parts[0][0] + parts[1][0]).toUpperCase();
    }

    function showToast(message, type = 'info') {
      const root = document.getElementById('toast-root');
      if (!root) return;
      const colors = {
        success: 'bg-emerald-600 text-white',
        error: 'bg-rose-600 text-white',
        warning: 'bg-amber-500 text-white',
        info: 'bg-slate-900 text-white'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-lg text-xs sm:text-sm font-semibold flex items-center gap-2.5 fade-in ${colors[type] || colors.info}`;
      el.innerHTML = `<span>${esc(message)}</span>`;
      root.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.25s ease';
        setTimeout(() => el.remove(), 260);
      }, 3200);
    }

    function openModal(htmlContent) {
      const root = document.getElementById('modal-root');
      if (!root) return;
      root.innerHTML = `
        <div id="global-modal-backdrop" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 fade-in">
          <div class="bg-white rounded-3xl max-w-xl w-full p-6 shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto">
            ${htmlContent}
          </div>
        </div>
      `;
      refreshIcons();
    }

    window.closeGlobalModal = function () {
      const root = document.getElementById('modal-root');
      if (root) root.innerHTML = '';
    };

    // Penyalinan Token Aman untuk iFrame menggunakan document.execCommand('copy')
    window.copyTokenText = function (text) {
      try {
        const tempInput = document.createElement('textarea');
        tempInput.value = text;
        tempInput.setAttribute('readonly', '');
        tempInput.style.position = 'fixed';
        tempInput.style.opacity = '0';
        document.body.appendChild(tempInput);
        tempInput.select();
        tempInput.setSelectionRange(0, 99999);
        document.execCommand('copy');
        document.body.removeChild(tempInput);
        showToast(`Token "${text}" berhasil disalin!`, 'success');
      } catch (err) {
        showToast(`Token Ujian: ${text}`, 'info');
      }
    };

    // Normalisasi URL Gambar (Mendukung link langsung & link share Google Drive)
    function normalizeImageUrl(rawUrl) {
      if (!rawUrl) return '';
      const trimmed = String(rawUrl).trim();
      if (!trimmed) return '';
      const driveMatch = trimmed.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)([a-zA-Z0-9_-]+)/);
      if (driveMatch && driveMatch[1]) {
        return `https://lh3.googleusercontent.com/d/${driveMatch[1]}`;
      }
      return trimmed;
    }

    // =========================================================================
    // SINKRONISASI DATA REAL-TIME FIRESTORE (SAAT IS_PREVIEW === false)
    // =========================================================================
    function cleanupListeners() {
      state.unsubscribers.forEach(unsub => {
        try { unsub(); } catch (e) {}
      });
      state.unsubscribers = [];
    }

    function startFirestoreSync() {
      if (IS_PREVIEW || !db) return;
      cleanupListeners();

      const collections = ['siswa', 'paket_ujian', 'bank_soal', 'sesi_ujian', 'hasil_nilai'];
      collections.forEach(colName => {
        const unsub = onSnapshot(collection(db, colName), (snapshot) => {
          state[colName] = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          renderApp();
        }, (err) => {
          console.error(`Error sync ${colName}:`, err);
        });
        state.unsubscribers.push(unsub);
      });
    }

    // =========================================================================
    // OPERASI CRUD DATABASE (DUAL-MODE: IN-MEMORY vs FIRESTORE)
    // =========================================================================
    async function dbCreate(colName, dataObj) {
      if (IS_PREVIEW) {
        const newItem = { id: `${colName}_${Date.now()}_${Math.floor(Math.random() * 999)}`, ...dataObj };
        state[colName].unshift(newItem);
        renderApp();
        return newItem.id;
      } else {
        const docRef = await addDoc(collection(db, colName), {
          ...dataObj,
          createdAt: serverTimestamp()
        });
        return docRef.id;
      }
    }

    async function dbUpdate(colName, docId, dataObj) {
      if (IS_PREVIEW) {
        const idx = state[colName].findIndex(item => item.id === docId);
        if (idx !== -1) {
          state[colName][idx] = { ...state[colName][idx], ...dataObj };
        }
        renderApp();
      } else {
        await updateDoc(doc(db, colName, docId), dataObj);
      }
    }

    async function dbDelete(colName, docId) {
      if (IS_PREVIEW) {
        state[colName] = state[colName].filter(item => item.id !== docId);
        renderApp();
      } else {
        await deleteDoc(doc(db, colName, docId));
      }
    }

    // =========================================================================
    // AI GENERATOR SOAL NON-PILIHAN GANDA UNTUK SMP
    // =========================================================================
    async function generateAISoalSMP({ mapel, kelas, topik, tipe, jumlah, kesulitan, apiKeyGemini }) {
      state.aiGenerating = true;
      renderApp();

      const prompt = `Buatkan ${jumlah} soal ujian SMP kelas ${kelas} mata pelajaran ${mapel} topik "${topik}" tingkat kesulitan ${kesulitan}.
WAJIB format BUKAN pilihan ganda, gunakan tipe soal: "${tipe}".
Kembalikan HANYA JSON array valid tanpa markdown dengan struktur:
[
  {
    "tipe_soal": "${tipe}",
    "pertanyaan": "teks pertanyaan",
    "kunci_jawaban": ${tipe === 'menjodohkan' ? '{"pairs":[{"kiri":"item 1","kanan":"pasangan 1"},{"kiri":"item 2","kanan":"pasangan 2"}]}' : tipe === 'benar_salah' ? '"Benar"' : tipe === 'isian_singkat' ? '"jawaban singkat"' : '""'},
    "rubrik_esai": "${tipe === 'esai' ? 'pedoman penskoran jawaban esai' : ''}",
    "bobot_skor": 20
  }
]`;

      const usedKey = (apiKeyGemini || '').trim();
      if (usedKey) {
        try {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${encodeURIComponent(usedKey)}`;
          let response = null;
          for (let attempt = 0; attempt < 3; attempt++) {
            response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { responseMimeType: 'application/json' }
              })
            });
            if (response.ok) break;
            await new Promise(r => setTimeout(r, 1000 * Math.pow(2, attempt)));
          }
          if (response && response.ok) {
            const data = await response.json();
            const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '[]';
            const parsed = JSON.parse(rawText);
            if (Array.isArray(parsed) && parsed.length > 0) {
              state.aiPreviewQuestions = parsed;
              state.aiGenerating = false;
              showToast(`AI berhasil menyusun ${parsed.length} soal ${mapel}!`, 'success');
              renderApp();
              return;
            }
          }
        } catch (err) {
          // Fallback ke generator kurikulum lokal cerdas
        }
      }

      // Generator Kurikulum Cerdas Instan (Berfungsi tanpa API Key)
      await new Promise(r => setTimeout(r, 650));
      const generated = [];
      for (let i = 1; i <= jumlah; i++) {
        if (tipe === 'isian_singkat') {
          generated.push({
            tipe_soal: 'isian_singkat',
            pertanyaan: `[${mapel} Kelas ${kelas} - ${kesulitan}] Pada materi ${topik} (bagian ke-${i}), istilah utama yang menjadi konsep dasar adalah ....`,
            kunci_jawaban: topik.split(' ')[0] || 'Konsep Utama',
            rubrik_esai: '',
            bobot_skor: Math.round(100 / jumlah)
          });
        } else if (tipe === 'benar_salah') {
          generated.push({
            tipe_soal: 'benar_salah',
            pertanyaan: `[${mapel} Kelas ${kelas}] Pernyataan ke-${i}: Pemahaman konsep ${topik} sangat berkaitan dengan penerapan prinsip ilmiah dalam kehidupan sehari-hari.`,
            kunci_jawaban: i % 2 === 1 ? 'Benar' : 'Salah',
            rubrik_esai: '',
            bobot_skor: Math.round(100 / jumlah)
          });
        } else if (tipe === 'menjodohkan') {
          generated.push({
            tipe_soal: 'menjodohkan',
            pertanyaan: `[${mapel} Kelas ${kelas}] Pasangkan konsep pada materi ${topik} berikut dengan penjelasan yang tepat!`,
            kunci_jawaban: {
              pairs: [
                { kiri: `Konsep A (${topik})`, kanan: 'Definisi utama bagian pertama' },
                { kiri: `Konsep B (${topik})`, kanan: 'Fungsi dan penerapan di lingkungan' },
                { kiri: `Konsep C (${topik})`, kanan: 'Dampak dan hasil pengamatan' }
              ]
            },
            rubrik_esai: '',
            bobot_skor: Math.round(100 / jumlah)
          });
        } else {
          generated.push({
            tipe_soal: 'esai',
            pertanyaan: `[${mapel} Kelas ${kelas} - ${kesulitan}] Jelaskan secara runtut analisis Anda mengenai ${topik} (studi kasus #${i}) beserta contoh penerapannya!`,
            kunci_jawaban: '',
            rubrik_esai: `Menyebutkan pengertian ${topik}, menjelaskan proses/faktor utama, dan memberikan 1 contoh konkret (Skor penuh ${Math.round(100 / jumlah)}).`,
            bobot_skor: Math.round(100 / jumlah)
          });
        }
      }

      state.aiPreviewQuestions = generated;
      state.aiGenerating = false;
      showToast(`AI berhasil menyusun ${generated.length} soal Non-PG siap tinjau!`, 'success');
      renderApp();
    }

    // =========================================================================

    // =========================================================================
    let violationCooldown = false;

    function triggerAntiCheatViolation(reason) {
      if (!state.activeExam || state.activeExam.isLocked || violationCooldown) return;
      violationCooldown = true;
      setTimeout(() => { violationCooldown = false; }, 1500);

      const exam = state.activeExam;
      exam.violations += 1;
      const timeStr = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      exam.violationLogs.push(`${timeStr} - ${reason}`);

      const maxLimit = exam.ujian.batas_pelanggaran || 3;
      const isNowLocked = exam.violations >= maxLimit;

      // Update ke database secara real-time agar pengawas langsung melihat peringatan
      dbUpdate('sesi_ujian', exam.sesiId, {
        jumlah_pelanggaran: exam.violations,
        log_pelanggaran: exam.violationLogs,
        status_pengerjaan: isNowLocked ? 'terkunci_curang' : 'mengerjakan'
      });

      if (isNowLocked) {
        exam.isLocked = true;
        clearInterval(state.examTimerInterval);
        openModal(`
          <div class="text-center space-y-4">
            <div class="w-16 h-16 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto">
              <i data-lucide="shield-alert" class="w-8 h-8"></i>

            <p class="text-sm text-slate-600 leading-relaxed">

            </p>
            <button onclick="window.finalizeExamSubmission(true)" class="w-full py-3 rounded-full bg-rose-600 hover:bg-rose-700 text-white font-bold text-sm shadow-lg transition">
              Kembali ke Beranda Siswa
            </button>
          </div>
        `);
      } else {
        openModal(`
          <div class="text-center space-y-4">
            <div class="w-16 h-16 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center mx-auto animate-bounce">
              <i data-lucide="alert-triangle" class="w-8 h-8"></i>

            <div class="inline-block px-3 py-1 rounded-full bg-rose-100 text-rose-700 text-xs font-extrabold">

            <p class="text-sm text-slate-600">
              Terdeteksi: <strong>${esc(reason)}</strong>.<br/>
              Jika pelanggaran mencapai <strong>${maxLimit} kali</strong>, ujian akan otomatis dikunci dan dikumpulkan!
            </p>
            <button onclick="window.resumeExamFullscreen()" class="w-full py-3 rounded-full bg-[#3B5BFD] hover:bg-blue-700 text-white font-bold text-sm shadow-lg transition">
              Saya Mengerti & Kembali Layar Penuh
            </button>
          </div>
        `);
      }
      renderApp();
    }

    window.verifyAndStartExam = async function (ujianId) {
      const ujian = state.paket_ujian.find(u => u.id === ujianId);
      const tokenInput = (document.getElementById('input-token-ujian')?.value || '').trim().toUpperCase();

      if (!ujian || tokenInput !== String(ujian.token_ujian).toUpperCase()) {
        showToast('Token Ujian tidak sesuai! Periksa kembali token dari guru.', 'error');
        return;
      }

      const questions = state.bank_soal
        .filter(s => s.ujian_id === ujian.id)
        .sort((a, b) => (a.nomor_urut || 0) - (b.nomor_urut || 0));

      window.closeGlobalModal();

      // Request Fullscreen
      try {
        if (document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        }
      } catch (e) {}

      const jamNow = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace(':', '.');
      const sesiId = await dbCreate('sesi_ujian', {
        ujian_id: ujian.id,
        siswa_id: state.currentUser.id,
        nama_siswa: state.currentUser.nama,
        kelas: state.currentUser.kelas,
        status_pengerjaan: 'mengerjakan',
        jumlah_pelanggaran: 0,
        log_pelanggaran: [],
        jawaban_siswa: {},
        jam_aktivitas: jamNow
      });

      state.activeExam = {
        ujian,
        sesiId,
        questions,
        currentIdx: 0,
        answers: {},
        timeLeftSec: (ujian.durasi_menit || 45) * 60,
        violations: 0,
        violationLogs: [],
        isLocked: false
      };

      clearInterval(state.examTimerInterval);
      state.examTimerInterval = setInterval(() => {
        if (!state.activeExam) {
          clearInterval(state.examTimerInterval);
          return;
        }
        state.activeExam.timeLeftSec -= 1;
        const timerBadge = document.getElementById('exam-countdown-text');
        if (timerBadge) {
          timerBadge.textContent = formatSeconds(state.activeExam.timeLeftSec);
        }
        if (state.activeExam.timeLeftSec <= 0) {
          clearInterval(state.examTimerInterval);
          window.finalizeExamSubmission(false);
        }
      }, 1000);

      renderApp();
    };

    function formatSeconds(sec) {
      const s = Math.max(0, sec);
      const mins = Math.floor(s / 60);
      const rem = s % 60;
      return `${String(mins).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
    }

    window.finalizeExamSubmission = async function (wasLockedCheat = false) {
      const exam = state.activeExam;
      if (!exam) return;

      clearInterval(state.examTimerInterval);
      window.closeGlobalModal();

      // Hitung skor otomatis (Isian Singkat, Benar/Salah, Menjodohkan)
      let skorOtomatis = 0;
      let hasEsai = false;

      exam.questions.forEach(q => {
        const ans = exam.answers[q.id];
        const bobot = Number(q.bobot_skor) || 20;

        if (q.tipe_soal === 'isian_singkat') {
          if (ans && String(ans).trim().toLowerCase() === String(q.kunci_jawaban || '').trim().toLowerCase()) {
            skorOtomatis += bobot;
          }
        } else if (q.tipe_soal === 'benar_salah') {
          if (ans && String(ans).toLowerCase() === String(q.kunci_jawaban || '').toLowerCase()) {
            skorOtomatis += bobot;
          }
        } else if (q.tipe_soal === 'menjodohkan') {
          const pairs = q.kunci_jawaban?.pairs || [];
          if (ans && pairs.length > 0) {
            let correctCount = 0;
            pairs.forEach(p => {
              if (ans[p.kiri] === p.kanan) correctCount += 1;
            });
            skorOtomatis += Math.round((correctCount / pairs.length) * bobot);
          }
        } else if (q.tipe_soal === 'esai') {
          hasEsai = true;
        }
      });

      await dbUpdate('sesi_ujian', exam.sesiId, {
        status_pengerjaan: wasLockedCheat ? 'terkunci_curang' : 'selesai',
        jawaban_siswa: exam.answers,
        jumlah_pelanggaran: exam.violations,
        log_pelanggaran: exam.violationLogs
      });

      await dbCreate('hasil_nilai', {
        sesi_id: exam.sesiId,
        ujian_id: exam.ujian.id,
        judul_ujian: exam.ujian.judul_ujian,
        siswa_id: state.currentUser.id,
        nama_siswa: state.currentUser.nama,
        kelas: state.currentUser.kelas,
        skor_otomatis: skorOtomatis,
        skor_esai: 0,
        nilai_akhir: skorOtomatis,
        status_koreksi: hasEsai ? 'menunggu_koreksi' : 'final'
      });

      state.activeExam = null;

      try {
        if (document.fullscreenElement && document.exitFullscreen) {
          await document.exitFullscreen();
        }
      } catch (e) {}

      showToast(
        wasLockedCheat
          ? 'Ujian terkunci karena pelanggaran anti-curang. Jawaban tercatat.'
          : 'Ujian berhasil dikumpulkan! Terima kasih.',
        wasLockedCheat ? 'error' : 'success'
      );
      state.activeMenu = 'riwayat';
      renderApp();
    };

    // =========================================================================

    function renderExamLockdownView() {
      const exam = state.activeExam;
      const soal = exam.questions[exam.currentIdx];
      const maxLimit = exam.ujian.batas_pelanggaran || 3;
      const currentAns = exam.answers[soal.id];

      let inputHtml = '';
      if (soal.tipe_soal === 'isian_singkat') {
        inputHtml = `
          <div class="mt-5">
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Ketik Jawaban Singkat Anda:</label>
            <input
              type="text"
              value="${esc(currentAns || '')}"
              oninput="window.saveStudentAnswer('${soal.id}', this.value)"
              placeholder="Tuliskan jawaban singkat di sini..."
              class="w-full px-5 py-4 rounded-2xl border-2 border-slate-200 focus:border-[#3B5BFD] focus:outline-none text-base font-bold text-slate-900 bg-slate-50/50 focus:bg-white"
            />
          </div>
        `;
      } else if (soal.tipe_soal === 'benar_salah') {
        inputHtml = `
          <div class="mt-5 grid grid-cols-1 sm:grid-cols-2 gap-4">
            ${['Benar', 'Salah'].map(opt => {
              const selected = currentAns === opt;
              return `
                <button
                  type="button"
                  onclick="window.saveStudentAnswer('${soal.id}', '${opt}'); renderApp();"
                  class="p-5 rounded-2xl border-2 text-left transition flex items-center justify-between ${
                    selected
                      ? 'border-[#3B5BFD] bg-blue-50/70 text-[#3B5BFD] shadow-sm'
                      : 'border-slate-200 hover:border-slate-300 bg-white text-slate-700'
                  }"
                >
                  <span class="text-base font-extrabold">${opt}</span>
                  <span class="w-6 h-6 rounded-full border-2 flex items-center justify-center ${
                    selected ? 'border-[#3B5BFD] bg-[#3B5BFD] text-white' : 'border-slate-300'
                  }">
                    ${selected ? '✓' : ''}
                  </span>
                </button>
              `;
            }).join('')}
          </div>
        `;
      } else if (soal.tipe_soal === 'menjodohkan') {
        const pairs = soal.kunci_jawaban?.pairs || [];

                <div class="md:col-span-1 text-center text-slate-400 font-bold hidden md:block">→</div>
                <div class="md:col-span-6">

                    onchange="window.saveMatchingAnswer('${soal.id}', '${esc(p.kiri)}', this.value)"

          <div class="mt-5">
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Tuliskan Uraian / Jawaban Lengkap Anda:</label>

              oninput="window.saveStudentAnswer('${soal.id}', this.value)"

            >${esc(currentAns || '')}</textarea>

            <div class="lg:col-span-8 bg-white rounded-3xl p-6 sm:p-8 shadow-soft border border-slate-100 flex flex-col justify-between">
              <div>

                ${soal.gambar_url ? `
                  <div class="mt-4 p-3 rounded-2xl bg-slate-50 border border-slate-200/80 inline-block max-w-full">
                    <img
                      src="${esc(normalizeImageUrl(soal.gambar_url))}"
                      alt="Ilustrasi Soal"
                      onerror="this.onerror=null;this.src='https://placehold.co/640x240/F1F5F9/64748B?text=Gambar+Soal+Tidak+Dapat+Dimuat';"
                      onclick="window.openImageZoom('${esc(soal.gambar_url)}')"

                    <div class="mt-2 flex items-center justify-between gap-3 text-[11px] text-slate-500">

                  class="px-5 py-2.5 rounded-full border border-slate-200 text-xs sm:text-sm font-bold text-slate-700 hover:bg-slate-50 disabled:opacity-40"

                  <button

                  >
                    Selesai & Kumpulkan ✓
                  </button>
                `}
              </div>
            </div>

            <!-- Panel Navigasi Nomor & Status Anti-Curang -->
            <div class="lg:col-span-4 space-y-4">
              <div class="bg-white rounded-3xl p-6 shadow-soft border border-slate-100">
                <h3 class="text-sm font-extrabold text-slate-900 mb-3">Navigasi Nomor Soal</h3>
                <div class="grid grid-cols-5 gap-2.5">
                  ${exam.questions.map((q, idx) => {
                    const isCurrent = idx === exam.currentIdx;
                    const hasAns = exam.answers[q.id] !== undefined && exam.answers[q.id] !== '';
                    return `
                      <button
                        id="nav-q-${q.id}"
                        type="button"
                        onclick="window.jumpToQuestion(${idx})"
                        class="h-11 rounded-2xl text-xs font-extrabold transition ${
                          isCurrent
                            ? 'ring-2 ring-[#3B5BFD] ring-offset-2 bg-[#3B5BFD] text-white'

                      >
                        ${idx + 1}
                      </button>
                    `;
                  }).join('')}
                </div>

                <button
                  type="button"
                  onclick="window.confirmFinishExam()"
                  class="w-full mt-6 py-3 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-md transition"

    // =========================================================================

    function renderAdminContent() {
      switch (state.activeMenu) {
        case 'ai_soal':
          return renderAdminAISoal();
        case 'paket_ujian':
          return renderAdminPaketUjian();
        case 'siswa':
          return renderAdminSiswa();

          return renderAdminMonitoring();

          return renderAdminDashboard();
      }

    // --- MENU 1 ADMIN: DASHBOARD BENTO & TIMELINE (PERSIS GAMBAR REFERENSI) ---
    function renderAdminDashboard() {
      const totalSiswa = state.siswa.length;
      const totalSesi = state.sesi_ujian.length;
      const sesiSelesai = state.sesi_ujian.filter(s => s.status_pengerjaan === 'selesai').length;
      const sesiCurang = state.sesi_ujian.filter(s => (s.jumlah_pelanggaran || 0) > 0).length;

      const pctSelesai = totalSesi > 0 ? Math.round((sesiSelesai / totalSesi) * 100) : 0;
      const pctAktif = totalSiswa > 0 ? Math.min(100, Math.round((totalSesi / totalSiswa) * 100)) : 0;
      const pctCurang = totalSesi > 0 ? Math.round((sesiCurang / totalSesi) * 100) : 0;

                  <rect x="48" y="9" width="6" height="17" rx="1" fill="#4ADE80" />
                  <rect x="56" y="10" width="6" height="16" rx="1" fill="#FFFFFF" />
                  <rect x="28" y="34" width="6" height="16" rx="1" fill="#A78BFA" />
                  <rect x="36" y="32" width="6" height="18" rx="1" fill="#34D399" />

                  <rect x="52" y="33" width="6" height="17" rx="1" fill="#F87171" />

              <div class="relative z-10 mt-3">

            <!-- Kartu 3: Coral-Merah -->

              <div class="flex justify-between items-start relative z-10">

                  ${state.sesi_ujian.map((sesi, idx) => {
                    const paket = state.paket_ujian.find(u => u.id === sesi.ujian_id);
                    const isHighlighted = sesi.status_pengerjaan === 'mengerjakan';
                    const offsetClass = idx % 3 === 0 ? 'ml-4 sm:ml-10' : idx % 3 === 1 ? 'ml-16 sm:ml-44' : 'ml-8 sm:ml-24';
                    return `
                      <div class="${offsetClass} max-w-md">
                        <div
                          onclick="window.navigateMenu('monitoring')"
                          class="cursor-pointer rounded-full px-5 py-3 flex items-center justify-between gap-4 transition transform hover:-translate-y-0.5 ${
                            isHighlighted
                              ? 'bg-[#3B5BFD] text-white shadow-lg shadow-blue-500/25'

                        >

    // --- MENU 2 ADMIN: AI GENERATOR, INPUT MANUAL, UNGGAH WORD/EXCEL & BANK SOAL ---
    function renderAdminAISoal() {
      const ujianOptions = state.paket_ujian;
      const filteredSoal = state.bank_soal.filter(q => {
        const matchUjian = state.selectedUjianFilter === 'ALL' || q.ujian_id === state.selectedUjianFilter;
        const matchSearch = !state.searchQuery || q.pertanyaan.toLowerCase().includes(state.searchQuery.toLowerCase());
        return matchUjian && matchSearch;

              <button
                type="button"
                onclick="window.switchSoalCreatorTab('manual')"

                  activeTab === 'manual' ? 'bg-[#3B5BFD] text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'

                <i data-lucide="pen-square" class="w-3.5 h-3.5"></i> Input Soal Manual
              </button>
              <button
                type="button"
                onclick="window.switchSoalCreatorTab('upload')"
                class="px-4 py-2 rounded-xl text-xs font-extrabold transition flex items-center gap-1.5 ${
                  activeTab === 'upload' ? 'bg-[#3B5BFD] text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'

        const item = state.aiPreviewQuestions[i];

          ujian_id: targetUjianId,
          nomor_urut: existingCount + i + 1,
          tipe_soal: item.tipe_soal,
          pertanyaan: item.pertanyaan,
          gambar_url: i === 0 ? (state.aiImageUrl || '') : '',
          kunci_jawaban: item.kunci_jawaban,
          rubrik_esai: item.rubrik_esai || '',
          bobot_skor: item.bobot_skor || 20,
          sumber_ai: true

      let kunciJawaban = '';
      let rubrikEsai = '';

        const raw = document.getElementById('in-man-pairs')?.value || '';
        const pairs = raw.split('\n').map(line => {
          const [k, v] = line.split('=');
          return k && v ? { kiri: k.trim(), kanan: v.trim() } : null;
        }).filter(Boolean);
        if (pairs.length === 0) {
          showToast('Format menjodohkan minimal 1 baris dengan tanda "="', 'warning');
          return;
        }
        kunciJawaban = { pairs };
      } else if (tipe === 'esai') {
        rubrikEsai = document.getElementById('in-man-rubrik')?.value || '';

        kunciJawaban = document.getElementById('in-man-kunci')?.value || '';

    // Handler Upload File Excel (.xlsx/.xls/.csv) & Word (.docx)
    window.handleSoalFileUpload = async function (event) {
      const file = event.target.files?.[0];
      if (!file) return;

      state.uploadFileName = file.name;
      const ext = file.name.split('.').pop().toLowerCase();

      try {
        if (['xlsx', 'xls', 'csv'].includes(ext)) {
          if (typeof XLSX === 'undefined') {
            showToast('Parser Excel belum siap, muat ulang halaman.', 'error');
            return;
          }
          const buffer = await file.arrayBuffer();
          const workbook = XLSX.read(buffer, { type: 'array' });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const jsonRows = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });

          const parsed = jsonRows
            .filter(r => r.Pertanyaan || r.pertanyaan || r.Soal || r.soal)
            .map(r => {
              const tipe = normalizeImportedTipe(r.Tipe_Soal || r.tipe_soal || r.Tipe || r.tipe);
              const pertanyaan = String(r.Pertanyaan || r.pertanyaan || r.Soal || r.soal).trim();
              const rawKunci = String(r.Kunci_Jawaban || r.kunci_jawaban || r.Kunci || r.kunci || '').trim();
              const rubrik = String(r.Rubrik_Esai || r.rubrik_esai || r.Rubrik || '').trim();
              const bobot = Number(r.Bobot || r.bobot || r.Bobot_Skor || 20) || 20;
              const gambarUrl = String(r.URL_Gambar || r.url_gambar || r.Gambar || r.gambar || '').trim();

              let kunciObj = rawKunci;
              if (tipe === 'menjodohkan') {
                const pairs = rawKunci.split(/;|\n/).map(p => {
                  const [k, v] = p.split('=');
                  return k && v ? { kiri: k.trim(), kanan: v.trim() } : null;
                }).filter(Boolean);
                kunciObj = { pairs };
              }

              return {
                tipe_soal: tipe,
                pertanyaan,
                gambar_url: gambarUrl,
                kunci_jawaban: tipe === 'esai' ? '' : kunciObj,
                rubrik_esai: tipe === 'esai' ? (rubrik || rawKunci) : rubrik,
                bobot_skor: bobot
              };
            });

          state.uploadPreviewQuestions = parsed;
          showToast(`Berhasil membaca ${parsed.length} soal dari Excel!`, 'success');
          renderApp();
        } else if (ext === 'docx') {
          if (typeof mammoth === 'undefined') {
            showToast('Parser Word (.docx) belum siap, muat ulang halaman.', 'error');
            return;
          }
          const buffer = await file.arrayBuffer();
          const result = await mammoth.extractRawText({ arrayBuffer: buffer });
          const rawText = result.value || '';
          const blocks = rawText.split(/\n\s*\n/);
          const parsed = [];

          blocks.forEach(block => {
            const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
            let tipe = 'isian_singkat';
            let soal = '';
            let kunci = '';
            let bobot = 20;
            let gambar = '';

            lines.forEach(line => {
              if (/^TIPE\s*:/i.test(line)) tipe = normalizeImportedTipe(line.replace(/^TIPE\s*:/i, ''));
              else if (/^SOAL\s*:/i.test(line)) soal = line.replace(/^SOAL\s*:/i, '').trim();
              else if (/^KUNCI\s*:/i.test(line)) kunci = line.replace(/^KUNCI\s*:/i, '').trim();
              else if (/^BOBOT\s*:/i.test(line)) bobot = Number(line.replace(/^BOBOT\s*:/i, '').trim()) || 20;
              else if (/^GAMBAR\s*:/i.test(line)) gambar = line.replace(/^GAMBAR\s*:/i, '').trim();
            });

            if (soal) {
              let kunciObj = kunci;
              if (tipe === 'menjodohkan') {
                const pairs = kunci.split(/;|\|/).map(p => {
                  const [k, v] = p.split('=');
                  return k && v ? { kiri: k.trim(), kanan: v.trim() } : null;
                }).filter(Boolean);
                kunciObj = { pairs };
              }
              parsed.push({
                tipe_soal: tipe,
                pertanyaan: soal,
                gambar_url: gambar,
                kunci_jawaban: tipe === 'esai' ? '' : kunciObj,
                rubrik_esai: tipe === 'esai' ? kunci : '',
                bobot_skor: bobot
              });
            }
          });

          state.uploadPreviewQuestions = parsed;
          if (parsed.length === 0) {
            showToast('Format teks Word tidak terbaca. Unduh "Contoh Format Word" sebagai acuan.', 'warning');
          } else {
            showToast(`Berhasil membaca ${parsed.length} soal dari Word (.docx)!`, 'success');
          }
          renderApp();
        } else {
          showToast('Format file harus .xlsx, .xls, .csv, atau .docx!', 'error');
        }
      } catch (err) {
        console.error(err);
        showToast('Gagal memproses file. Pastikan format sesuai template.', 'error');
      }
    };

              <input id="new-siswa-nama" type="text" required placeholder="Contoh: Ahmad Fauzan" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 font-semibold" />
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block font-bold text-slate-700 mb-1">NISN / Username Login</label>
                <input id="new-siswa-nisn" type="text" required placeholder="2026003" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 font-semibold" />
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1">Kelas</label>
                <input id="new-siswa-kelas" type="text" required placeholder="8A" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 font-semibold" />
              </div>
            </div>
            <div>
              <label class="block font-bold text-slate-700 mb-1">Password Login</label>
              <input id="new-siswa-pass" type="text" required value="123456" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 font-semibold" />
            </div>
            <div class="pt-3 flex gap-2">
              <button type="button" onclick="window.closeGlobalModal()" class="flex-1 py-3 rounded-full border border-slate-200 font-bold text-slate-600">Batal</button>
              <button type="submit" class="flex-1 py-3 rounded-full bg-[#3B5BFD] text-white font-bold shadow-md">Simpan Siswa</button>
            </div>
          </form>
        </div>
      `);
    };

    window.submitAddSiswa = async function () {
      const nama = document.getElementById('new-siswa-nama').value.trim();
      const nisn = document.getElementById('new-siswa-nisn').value.trim();
      const kelas = document.getElementById('new-siswa-kelas').value.trim();
      const pass = document.getElementById('new-siswa-pass').value.trim();

      await dbCreate('siswa', {
        nama_lengkap: nama,
        nisn_username: nisn,
        kelas,
        password: pass,
        status_aktif: true
      });

      window.closeGlobalModal();
      showToast('Akun siswa berhasil ditambahkan!', 'success');
    };

    window.deleteSiswaItem = async function (id) {
      await dbDelete('siswa', id);
      showToast('Data siswa dihapus.', 'info');
    };

    // --- MENU 5 ADMIN: MONITORING LIVE ANTI-CURANG & KOREKSI ESAI ---
    function renderAdminMonitoring() {
      return `
        <div class="fade-in space-y-6">
          <div>
            <h1 class="text-2xl font-extrabold text-slate-900">Monitoring Anti-Curang & Koreksi Nilai</h1>
            <p class="text-xs text-slate-500">Pantau pelanggaran minimize siswa secara langsung, reset sesi terkunci, dan beri skor jawaban esai.</p>
          </div>

          <!-- Monitoring Sesi Ujian Live -->
          <div class="bg-white rounded-3xl p-6 shadow-soft border border-slate-100">
            <h2 class="text-base font-extrabold text-slate-900 mb-4">Status Sesi Peserta Ujian (${state.sesi_ujian.length})</h2>
            ${state.sesi_ujian.length === 0 ? `
              <p class="text-center py-8 text-xs text-slate-400">Belum ada siswa yang memulai sesi ujian.</p>
            ` : `
              <div class="space-y-3">
                ${state.sesi_ujian.map(s => {
                  const paket = state.paket_ujian.find(u => u.id === s.ujian_id);
                  const isCurang = s.status_pengerjaan === 'terkunci_curang' || (s.jumlah_pelanggaran || 0) > 0;
                  return `
                    <div class="p-4 rounded-2xl border ${isCurang ? 'border-rose-200 bg-rose-50/40' : 'border-slate-100 bg-slate-50/50'} flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                      <div class="space-y-1">
                        <div class="flex flex-wrap items-center gap-2">
                          <span class="text-sm font-extrabold text-slate-900">${esc(s.nama_siswa)}</span>
                          <span class="px-2.5 py-0.5 rounded-full bg-white border border-slate-200 text-[11px] font-bold">Kelas ${esc(s.kelas)}</span>
                          <span class="px-2.5 py-0.5 rounded-full text-[11px] font-extrabold ${
                            s.status_pengerjaan === 'selesai'
                              ? 'bg-emerald-100 text-emerald-700'
                              : s.status_pengerjaan === 'terkunci_curang'
                              ? 'bg-rose-600 text-white'
                              : 'bg-blue-100 text-[#3B5BFD]'
                          }">
                            ${s.status_pengerjaan.replace('_', ' ').toUpperCase()}
                          </span>
                        </div>
                        <p class="text-xs text-slate-500">${paket ? esc(paket.judul_ujian) : 'Paket Ujian'} • Pelanggaran Minimize: <strong class="${isCurang ? 'text-rose-600' : 'text-slate-700'}">${s.jumlah_pelanggaran || 0}x</strong></p>
                        ${(s.log_pelanggaran || []).length > 0 ? `
                          <p class="text-[11px] text-rose-600 font-semibold">Log Terakhir: ${esc(s.log_pelanggaran[s.log_pelanggaran.length - 1])}</p>
                        ` : ''}
                      </div>

                      <button onclick="window.resetSesiUjian('${s.id}')" class="self-start sm:self-center px-4 py-2 rounded-full bg-white border border-slate-200 hover:bg-rose-50 hover:text-rose-600 text-xs font-bold transition">
                        Reset Ujian Siswa
                      </button>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>

          <!-- Rekap Nilai & Koreksi Jawaban Esai -->
          <div class="bg-white rounded-3xl p-6 shadow-soft border border-slate-100">
            <h2 class="text-base font-extrabold text-slate-900 mb-4">Rekap Nilai & Koreksi Esai (${state.hasil_nilai.length})</h2>
            ${state.hasil_nilai.length === 0 ? `
              <p class="text-center py-8 text-xs text-slate-400">Belum ada hasil ujian yang dikumpulkan.</p>
            ` : `
              <div class="space-y-3">
                ${state.hasil_nilai.map(n => `
                  <div class="p-4 rounded-2xl border border-slate-100 bg-slate-50/50 flex flex-wrap items-center justify-between gap-3">
                    <div>
                      <p class="text-sm font-extrabold text-slate-900">${esc(n.nama_siswa)} <span class="text-xs font-semibold text-slate-400">(${esc(n.kelas)})</span></p>
                      <p class="text-xs text-slate-500">${esc(n.judul_ujian)}</p>
                      <p class="text-xs font-bold text-slate-700 mt-1">
                        Skor Otomatis: ${n.skor_otomatis} + Skor Esai: ${n.skor_esai} = <span class="text-[#3B5BFD] text-sm font-extrabold">Nilai Akhir: ${n.nilai_akhir}</span>
                      </p>
                    </div>
                    <button onclick="window.openKoreksiEsaiModal('${n.id}')" class="px-4 py-2 rounded-full bg-[#3B5BFD] hover:bg-blue-700 text-white text-xs font-bold shadow-sm">
                      Koreksi / Input Skor Esai
                    </button>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    window.resetSesiUjian = async function (sesiId) {
      await dbDelete('sesi_ujian', sesiId);
      showToast('Sesi ujian siswa berhasil di-reset. Siswa dapat mengulang ujian.', 'info');
    };

    window.openKoreksiEsaiModal = function (nilaiId) {
      const nilai = state.hasil_nilai.find(n => n.id === nilaiId);
      if (!nilai) return;
      const sesi = state.sesi_ujian.find(s => s.id === nilai.sesi_id);
      const esaiQuestions = state.bank_soal.filter(q => q.ujian_id === nilai.ujian_id && q.tipe_soal === 'esai');

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-extrabold text-slate-900">Koreksi Jawaban Esai — ${esc(nilai.nama_siswa)}</h3>
            <button onclick="window.closeGlobalModal()" class="p-1.5 rounded-full hover:bg-slate-100 text-slate-500">
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>
          </div>
          <div class="space-y-3 max-h-60 overflow-y-auto">
            ${esaiQuestions.length === 0 ? `
              <p class="text-xs text-slate-500">Paket ujian ini tidak memiliki soal esai, namun Anda tetap dapat menyesuaikan skor tambahan.</p>
            ` : esaiQuestions.map((q, i) => `
              <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs space-y-1.5">
                <p class="font-bold text-slate-800">Pertanyaan Esai #${i + 1}: ${esc(q.pertanyaan)}</p>
                <p class="text-emerald-700 font-semibold">Rubrik: ${esc(q.rubrik_esai || '-')}</p>
                <div class="p-2.5 rounded-xl bg-white border border-slate-200 text-slate-900">
                  <strong>Jawaban Siswa:</strong> ${esc(sesi?.jawaban_siswa?.[q.id] || '(Tidak dijawab)')}
                </div>
              </div>
            `).join('')}
          </div>
          <form onsubmit="event.preventDefault(); window.submitKoreksiEsai('${nilai.id}');" class="space-y-3 text-xs">
            <div>
              <label class="block font-bold text-slate-700 mb-1">Total Skor Tambahan / Esai (0 - 100)</label>
              <input id="input-skor-esai" type="number" min="0" max="100" value="${nilai.skor_esai || 0}" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 font-extrabold text-base" />
            </div>
            <div class="flex gap-2 pt-2">
              <button type="button" onclick="window.closeGlobalModal()" class="flex-1 py-3 rounded-full border border-slate-200 font-bold text-slate-600">Batal</button>
              <button type="submit" class="flex-1 py-3 rounded-full bg-emerald-600 text-white font-bold shadow-md">Simpan Nilai Akhir</button>
            </div>
          </form>
        </div>
      `);
    };

    window.submitKoreksiEsai = async function (nilaiId) {
      const nilai = state.hasil_nilai.find(n => n.id === nilaiId);
      if (!nilai) return;
      const skorEsai = Number(document.getElementById('input-skor-esai').value) || 0;
      const nilaiAkhir = Math.min(100, (Number(nilai.skor_otomatis) || 0) + skorEsai);

      await dbUpdate('hasil_nilai', nilaiId, {
        skor_esai: skorEsai,
        nilai_akhir: nilaiAkhir,
        status_koreksi: 'final'
      });

      window.closeGlobalModal();
      showToast(`Nilai akhir berhasil diperbarui menjadi ${nilaiAkhir}!`, 'success');
    };

    // =========================================================================
    // KONTEN PANEL SISWA (PESERTA UJIAN)
    // =========================================================================
    function renderSiswaContent() {
      if (state.activeMenu === 'riwayat') {
        const myNilai = state.hasil_nilai.filter(n => n.siswa_id === state.currentUser.id);
        return `
          <div class="fade-in space-y-6">
            <div>
              <h1 class="text-2xl font-extrabold text-slate-900">Riwayat & Hasil Ujian Saya</h1>
              <p class="text-xs text-slate-500">Daftar ujian yang telah Anda kumpulkan beserta nilai akhir.</p>
            </div>

            ${myNilai.length === 0 ? `
              <div class="bg-white rounded-3xl p-12 text-center border border-slate-100 text-xs text-slate-400">
                Anda belum memiliki riwayat pengumpulan ujian.
              </div>
            ` : `
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                ${myNilai.map(n => `
                  <div class="bg-white rounded-3xl p-6 shadow-soft border border-slate-100 flex items-center justify-between gap-4">
                    <div>
                      <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold ${
                        n.status_koreksi === 'final' ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'
                      }">
                        ${n.status_koreksi === 'final' ? 'NILAI FINAL' : 'MENUNGGU KOREKSI ESAI'}
                      </span>
                      <h3 class="text-base font-extrabold text-slate-900 mt-2">${esc(n.judul_ujian)}</h3>
                      <p class="text-xs text-slate-500 mt-0.5">Skor Otomatis: ${n.skor_otomatis} • Skor Esai: ${n.skor_esai}</p>
                    </div>
                    <div class="w-16 h-16 rounded-2xl bg-[#3B5BFD] text-white flex flex-col items-center justify-center shrink-0 shadow-md">
                      <span class="text-[10px] font-bold uppercase opacity-80">Nilai</span>
                      <span class="text-2xl font-extrabold">${n.nilai_akhir}</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        `;
      }

      // Beranda Siswa: Jadwal Ujian Tersedia
      const ujianTersedia = state.paket_ujian.filter(u => u.status_ujian === 'aktif');
      return `
        <div class="fade-in space-y-6">
          <div>
            <h1 class="text-2xl font-extrabold text-slate-900">Halo, ${esc(state.currentUser.nama)}! 👋</h1>
            <p class="text-xs text-slate-500">Pilih jadwal ujian aktif di bawah ini dan siapkan Token Ujian dari Bapak/Ibu Guru.</p>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            ${ujianTersedia.length === 0 ? `
              <div class="col-span-2 bg-white rounded-3xl p-12 text-center border border-slate-100 text-xs text-slate-400">
                Belum ada ujian aktif untuk kelas Anda saat ini.
              </div>
            ` : ujianTersedia.map(u => {
              const sudahSelesai = state.sesi_ujian.some(
                s => s.ujian_id === u.id && s.siswa_id === state.currentUser.id && ['selesai', 'terkunci_curang'].includes(s.status_pengerjaan)
              );
              const jumlahSoal = state.bank_soal.filter(s => s.ujian_id === u.id).length;

              return `
                <div class="bg-white rounded-3xl p-6 shadow-soft border border-slate-100 flex flex-col justify-between space-y-4">
                  <div>
                    <div class="flex items-center justify-between gap-2 mb-2">
                      <span class="px-3 py-1 rounded-full bg-blue-50 text-[#3B5BFD] text-xs font-extrabold">${esc(u.mata_pelajaran)}</span>
                      <span class="text-xs font-bold text-slate-400">Kelas ${esc(u.kelas_target)}</span>
                    </div>
                    <h3 class="text-lg font-extrabold text-slate-900 mb-1">${esc(u.judul_ujian)}</h3>
                    <p class="text-xs text-slate-500">${jumlahSoal} Soal Non-Pilihan Ganda • Durasi ${u.durasi_menit} Menit</p>
                  </div>

                  ${sudahSelesai ? `
                    <div class="py-3 px-4 rounded-2xl bg-emerald-50 text-emerald-700 text-xs font-extrabold text-center">
                      ✓ Anda Sudah Menyelesaikan Ujian Ini
                    </div>
                  ` : `
                    <button
                      type="button"
                      onclick="window.openStartExamModal('${u.id}')"
                      class="w-full py-3 rounded-full bg-[#3B5BFD] hover:bg-blue-700 text-white font-extrabold text-xs shadow-md transition"
                    >
                      Masukkan Token & Mulai Ujian →
                    </button>
                  `}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // RENDERER UTAMA & STARTUP
    // =========================================================================
    function renderApp() {
      const root = document.getElementById('app-root');
      if (!root) return;

      if (!state.currentUser) {
        root.innerHTML = renderLoginView();
      } else if (state.activeExam) {
        root.innerHTML = renderExamLockdownView();
      } else {
        root.innerHTML = renderMainShell();
      }

      refreshIcons();
    }

    // Boot aplikasi
    initPreviewData();
    if (!IS_PREVIEW && auth) {
      onAuthStateChanged(auth, (user) => {
        if (user) {
          state.currentUser = {
            role: 'admin',
            id: user.uid,
            nama: user.email ? user.email.split('@')[0] : 'Admin',
            email: user.email
          };
          startFirestoreSync();
        }
        renderApp();
      });
    }
    renderApp();
  </script>
</body>
</html>
